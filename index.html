<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="/_vercel/insights/script.js"></script>
    <title>Bishopric Tools</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
      }

      html {
        overflow: hidden;
      }

      body {
        height: 100vh;
        height: 100dvh;
      }

      iframe {
        width: 100%;
        height: 100%;
      }

      #loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        z-index: 9999;
      }

      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin-right: 10px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="spinner"></div>
      one moment...
    </div>
    <iframe
      id="iframe"
      style="border: none"
      src="https://script.google.com/macros/s/AKfycbzUc5DzaBGqSYCc_FMC1lQHgd5CqR89t83ab_ABgn64R8l9lj0xe2n3Q8IDZBN3t9sxIw/exec"
    ></iframe>
    <script>
      document.getElementById("iframe").onload = function () {
        document.getElementById("loader").style.display = "none";
      };
    </script>
  </body>
</html>
